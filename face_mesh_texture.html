<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    a-scene { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <a-scene mindar-face="faceOccluder: false" embedded vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-entity id="face" mindar-face-default-face-occluder></a-entity>
    <a-camera active="false" position="0 0 0"></a-camera>
  </a-scene>

  <script>
    document.querySelector('a-scene').addEventListener('arReady', () => {
      const THREE = AFRAME.THREE;
      // เปลี่ยน URL นี้เป็นภาพ texture ของคุณ
      const texture = new THREE.TextureLoader().load('https://erp4952.github.io/canonical_face_model_uv_visualization (2).png');
      //const texture = new THREE.TextureLoader().load('https://sibsansuk.github.io/courses/3dmodel/canonical_face_model_uv_visualization-2.png');
      texture.colorSpace = THREE.SRGBColorSpace;

      // ใช้ face mesh ของ MindAR แล้วเปลี่ยนจากวัสดุบังหน้าเป็น texture
      const mesh = document.querySelector('#face').getObject3D('mesh');
      mesh.material.dispose();
      mesh.material = new THREE.MeshBasicMaterial({
        map: texture, transparent: true, opacity: 0.85, side: THREE.DoubleSide
      });
      mesh.frustumCulled = false;
    });
  </script>
</body>
</html>
