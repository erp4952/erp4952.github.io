<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My WebAR Model</title>
  <!-- โหลดสคริปต์ model-viewer จาก Google -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      background-color: #f0f0f0;
    }
  </style>
</head>
<body>

  <!-- ตัวเล่นโมเดล 3D / AR -->
  <model-viewer 
    src="model.glb" 
    ios-src="model.usdz" 
    alt="3D Model" 
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    auto-rotate 
    shadow-intensity="1">
    
    <button slot="ar-button" style="position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 12px 24px; background: #007bff; color: white; border: none; border-radius: 25px; font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2);">
      👋 ดูในพื้นที่จริง (AR)
    </button>
    
  </model-viewer>

</body>
</html>
